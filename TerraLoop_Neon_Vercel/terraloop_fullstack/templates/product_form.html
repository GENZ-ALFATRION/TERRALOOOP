{% extends 'base.html' %}{% block title %}List a product{% endblock %}{% block content %}<section class="form-card"><span class="eyebrow">CONVERTER WORKSPACE</span><h1>List compost for sale</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Product name<input name="name" required placeholder="e.g. Screened organic compost"></label><label>Compost type<input name="compost_type" required placeholder="e.g. Vermicompost, garden compost"></label><label>Description<textarea name="description" rows="3"></textarea></label><div class="two"><label>Available quantity (kg)<input type="number" name="quantity_kg" min="0.1" step="0.1" required></label><label>Price per kg (₹)<input type="number" name="price_per_kg" min="0" step="0.01" required></label></div><label>Pickup / delivery location<input name="location"></label><button class="btn">Publish listing</button></form></section>{% endblock %}
