{% extends 'base.html' %}{% block title %}Request waste pickup{% endblock %}{% block content %}<section class="form-card"><span class="eyebrow">COLLEGE WORKSPACE</span><h1>Request biowaste collection</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Waste type<input name="waste_type" required placeholder="e.g. Canteen food scraps, garden waste"></label><label>Estimated quantity (kg)<input type="number" name="quantity_kg" min="0.1" step="0.1" required></label><label>Preferred pickup date<input type="date" name="pickup_date"></label><label>Collection notes<textarea name="notes" rows="3"></textarea></label><button class="btn">Submit collection request</button></form></section>{% endblock %}
